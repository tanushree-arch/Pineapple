<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mission Pineapple</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #f0d9d9,
                    #e4c4c7,
                    #dcb8bd
                );

            color: #5d4045;

            font-family:
                "Playfair Display",
                serif;

        }

        .page {

            width:
                min(
                    800px,
                    90vw
                );

        }

        .chapter {

            font-size: 10px;

            letter-spacing: .3em;

            color: #91646b;

        }

        h1 {

            margin: 20px 0;

            font-size:
                clamp(
                    40px,
                    6vw,
                    75px
                );

            font-weight: 500;

        }

        h1 em {

            color: #ae5968;

            font-style: italic;

        }

        p {

            font-family:
                "Caveat",
                cursive;

            font-size: 25px;

            color: #875963;

        }

        .back {

            display: inline-block;

            margin-top: 25px;

            padding:
                10px 18px;

            border:
                1px solid
                rgba(
                    120,
                    65,
                    75,
                    .3
                );

            color: #7e5059;

            text-decoration: none;

        }

    </style>

</head>

<body>

    <main class="page">

        <div class="chapter">
            CHAPTER V · THREE
        </div>

        <h1>
            ONE MORE
            <em>THING.</em>
        </h1>

        <p>
            We'll decide what goes here ♡
        </p>

        <a
            class="back"
            href="cats.html"
        >
            ← back
        </a>

    </main>

</body>

</html>
